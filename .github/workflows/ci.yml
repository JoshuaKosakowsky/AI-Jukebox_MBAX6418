name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tracked-file safeguards and scaffold
        run: python scripts/verify_repo.py
      - name: Verify full-brief coverage (not application acceptance)
        run: python scripts/check_readiness.py
      - name: Test readiness-gate behavior offline
        run: python -m unittest discover -s tests -p 'test_*.py'
